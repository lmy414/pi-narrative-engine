name: test

on:
  push:
    branches: [master, "feat/**"]
  pull_request:

jobs:
  packages:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 20 已 EOL（2026-04），且 @earendil-works/pi-coding-agent 的 undici
        # 依赖 Node>=22 内部 API（webidl.util.markAsUncloneable），20 下必崩
        node: [22, 24]
    defaults:
      run:
        # 统一用 bash：Windows 的 pwsh/cmd 不展开 tests/*.test.ts 通配符
        # （tsx --test 依赖 shell 展开 glob，win 下会报 Could not find）
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # better-sqlite3 原生绑定：prebuild 优先，失败则源码编译
      # （runner 自带编译工具链，三平台均可）
      - run: npm install

      # 子包单测（全部 mock，无需 API key / 网络）
      # 2026-07-31 world-graph 已迁移为独立仓库 underworld-graph，自有 CI，不再在此跑
      - name: role-pool
        working-directory: packages/role-pool
        run: npx tsx --test tests/*.test.ts

      - name: scheduler
        working-directory: packages/scheduler
        run: npx tsx --test tests/*.test.ts

      - name: renderer
        working-directory: packages/renderer
        run: npx tsx --test tests/*.test.ts

      - name: novel-importer
        working-directory: packages/novel-importer
        run: npx tsx --test tests/*.test.ts

      # H5 修复（2026-07-30）：补齐应用化核心包的 CI 覆盖
      # 注：pi-status.test.ts 的 mock spawn 在某些环境卡住（预先存在问题），
      #     暂时排除，待后续调查 mock 机制在 Node 24 的兼容性。
      - name: admin
        working-directory: packages/admin
        run: npx tsx --test tests/env-store.test.ts tests/embedder-status.test.ts tests/app-config.test.ts tests/updater.test.ts tests/novel-json.test.ts tests/files.test.ts tests/doctor.test.ts tests/rulesets.test.ts

      - name: novel-launcher
        working-directory: packages/novel-launcher
        run: npx tsx --test tests/*.test.ts

      # H5 修复：根 tests/ 全量纳入 CI（含 e2e + 集成测试 + tests/debug/）
      - name: root tests
        run: npx tsx --test tests/*.test.ts tests/debug/*.test.ts

      # L-Test-7：生产依赖安全审计（显式官方 registry——镜像源 audit 端点未实现；
      # 已知无修复版本的传递项：epub2→adm-zip、underworld-graph→drizzle-orm）。
      # 失败不阻断（当前存在已知无修复漏洞，退出码恒非零）；结果在 Actions 日志中可查。
      - name: npm audit (production)
        continue-on-error: true
        run: npm audit --omit=dev --registry=https://registry.npmjs.org
