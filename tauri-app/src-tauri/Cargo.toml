[package]
name = "narrative-engine-app"
version = "0.1.0"
description = "Narrative Engine desktop app (Tauri shell + Node sidecar)"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "narrative_engine_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
